<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sahaAI - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0d08;
            color: #e2e8f0;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        .neon-yellow { color: #d4f62e; }
        .bg-neon-yellow { background-color: #d4f62e; }
        .border-neon-yellow { border-color: #d4f62e; }
        .card-bg {
            background-color: #12150e;
            border: 1px solid #282e1c;
        }
        .inner-card {
            background-color: #181d13;
            border: 1px solid #2f3721;
        }
        .status-pending { color: #fbbf24; }
        .status-contacted { color: #60a5fa; }
        .status-converted { color: #34d399; }
        .status-lost { color: #f87171; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="border-b border-[#282e1c] px-6 py-4 flex items-center justify-between">
        <div class="text-2xl font-extrabold tracking-tight">
            <span class="text-white">saha</span><span class="neon-yellow">AI</span>
            <span class="text-xs text-gray-500 ml-2">Admin Portal</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Add Client Form -->
        <div class="card-bg rounded-2xl p-6 border border-[#2f3721] mb-8">
            <h2 class="text-lg font-bold text-white mb-4">Add New Client</h2>
            <form id="clientForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="editClientId" value="">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Client Name*</label>
                    <input type="text" id="clientName" required placeholder="Business name"
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Business Type*</label>
                    <input type="text" id="businessType" required placeholder="E-commerce, Healthcare, etc."
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Date of Joining*</label>
                    <input type="date" id="dateOfJoining" required
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Developer ID (optional)</label>
                    <input type="number" id="developerId" placeholder="1, 2, 3..."
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Login Email*</label>
                    <input type="email" id="loginEmail" required placeholder="client@company.com"
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Login Password*</label>
                    <input type="password" id="loginPassword" required placeholder="Min 6 characters"
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>
                
                <div class="md:col-span-2">
                    <button type="submit" id="submitClientBtn"
                            class="w-full bg-neon-yellow hover:bg-yellow-300 text-black font-bold text-sm py-3 rounded-lg transition-all">
                        Add Client & Create Login
                    </button>
                </div>
            </form>
            <div id="clientFormMsg" class="text-xs mt-3 hidden"></div>
        </div>

        <!-- All Inquiries -->
        <div class="card-bg rounded-2xl p-6 border border-[#2f3721]">
            <h2 class="text-lg font-bold text-white mb-4">All Client Inquiries</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-[#282e1c] text-left text-xs text-gray-400 uppercase">
                            <th class="pb-3 pr-4">#</th>
                            <th class="pb-3 pr-4">Client</th>
                            <th class="pb-3 pr-4">Customer</th>
                            <th class="pb-3 pr-4">Mobile</th>
                            <th class="pb-3 pr-4">Service</th>
                            <th class="pb-3 pr-4">Status</th>
                            <th class="pb-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="allInquiriesTable">
                        <tr>
                            <td colspan="7" class="text-center text-gray-500 py-8">Loading inquiries...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.port === '8000'
            ? ''
            : `${window.location.protocol}//${window.location.hostname}:8000`;

        // Load all inquiries
        async function loadAllInquiries() {
            try {
                const response = await fetch(`${API_BASE}/api/inquiries/all`);
                const data = await response.json();
                
                const tbody = document.getElementById('allInquiriesTable');
                
                if (!data.length) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="text-center text-gray-500 py-8">No inquiries found</td>
                        </tr>
                    `;
                    return;
                }
                
                tbody.innerHTML = data.map((inquiry, index) => `
                    <tr class="border-b border-[#1a1f14] hover:bg-[#181d13] transition">
                        <td class="py-3 pr-4 text-gray-400">${index + 1}</td>
                        <td class="py-3 pr-4 text-white font-medium">${inquiry.client_name}</td>
                        <td class="py-3 pr-4">
                            <div class="text-white">${inquiry.first_name} ${inquiry.last_name}</div>
                            <div class="text-xs text-gray-500">${inquiry.email || 'No email'}</div>
                        </td>
                        <td class="py-3 pr-4 text-gray-300">${inquiry.mobile}</td>
                        <td class="py-3 pr-4 text-gray-300 text-xs">${inquiry.service_type}</td>
                        <td class="py-3 pr-4">
                            <span class="status-${inquiry.status} text-xs font-semibold uppercase">${inquiry.status}</span>
                        </td>
                        <td class="py-3">
                            <select onchange="updateStatus(${inquiry.inquiry_id}, this.value)" 
                                    class="bg-[#181d13] border border-[#2f3721] text-xs text-white rounded px-2 py-1 outline-none">
                                <option value="pending" ${inquiry.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="contacted" ${inquiry.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                                <option value="converted" ${inquiry.status === 'converted' ? 'selected' : ''}>Converted</option>
                                <option value="lost" ${inquiry.status === 'lost' ? 'selected' : ''}>Lost</option>
                            </select>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                document.getElementById('allInquiriesTable').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-red-400 py-8">Failed to load inquiries</td>
                    </tr>
                `;
            }
        }

        // Update status
        async function updateStatus(inquiryId, status) {
            try {
                const response = await fetch(`${API_BASE}/api/inquiries/${inquiryId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                
                if (response.ok) {
                    await loadAllInquiries();
                } else {
                    alert('Failed to update status');
                }
            } catch (error) {
                alert('Network error');
            }
        }

        // Add client form
        document.getElementById('clientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('clientName').value.trim(),
                business_type: document.getElementById('businessType').value.trim(),
                date_of_joining: document.getElementById('dateOfJoining').value,
                developer_id: parseInt(document.getElementById('developerId').value) || null,
                email: document.getElementById('loginEmail').value.trim(),
                password: document.getElementById('loginPassword').value.trim()
            };
            
            const msgDiv = document.getElementById('clientFormMsg');
            const submitBtn = document.getElementById('submitClientBtn');
            
            msgDiv.classList.add('hidden');
            submitBtn.innerHTML = 'Creating...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/api/clients`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    msgDiv.className = 'text-emerald-400 text-xs mt-3';
                    msgDiv.textContent = `✅ Client ${data.client_id} created successfully!`;
                    msgDiv.classList.remove('hidden');
                    this.reset();
                    await loadAllInquiries();
                } else {
                    msgDiv.className = 'text-red-400 text-xs mt-3';
                    msgDiv.textContent = '❌ Error: ' + data.error;
                    msgDiv.classList.remove('hidden');
                }
            } catch (error) {
                msgDiv.className = 'text-red-400 text-xs mt-3';
                msgDiv.textContent = '❌ Network error. Please try again.';
                msgDiv.classList.remove('hidden');
            } finally {
                submitBtn.innerHTML = 'Add Client & Create Login';
                submitBtn.disabled = false;
            }
        });

        // Initialize
        loadAllInquiries();
    </script>

</body>
</html>
