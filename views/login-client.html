<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sahaAI Client- Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0d08;
            color: #e2e8f0;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        .neon-yellow { color: #d4f62e; }
        .bg-neon-yellow { background-color: #d4f62e; }
        .border-neon-yellow { border-color: #d4f62e; }
        .card-bg {
            background-color: #12150e;
            border: 1px solid #282e1c;
        }
        .inner-card {
            background-color: #181d13;
            border: 1px solid #2f3721;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-4xl font-extrabold tracking-tight">
                <span class="text-white">saha</span><span class="neon-yellow">AI</span>
            </div>
            <p class="text-gray-400 text-xs mt-2">Client Portal Login</p>
        </div>

        <!-- Login Card -->
        <div class="card-bg rounded-2xl p-8 shadow-2xl border border-[#2f3721]">
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="client@company.com"
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password"
                           class="w-full inner-card text-sm text-white rounded-lg p-3 outline-none border border-transparent focus:border-neon-yellow transition">
                </div>

                <button type="submit" id="loginBtn"
                        class="w-full bg-neon-yellow hover:bg-yellow-300 text-black font-bold text-sm py-3.5 rounded-lg transition-all shadow-lg mt-2">
                    Login &rarr;
                </button>

                <div id="errorMsg" class="text-red-400 text-xs text-center hidden"></div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.port === '8000'
            ? ''
            : `${window.location.protocol}//${window.location.hostname}:8000`;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            errorMsg.classList.add('hidden');
            loginBtn.innerHTML = 'Logging in...';
            loginBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login-client`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    window.location.href = 'client-dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.classList.remove('hidden');
                    loginBtn.innerHTML = 'Login &rarr;';
                    loginBtn.disabled = false;
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
                loginBtn.innerHTML = 'Login &rarr;';
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
